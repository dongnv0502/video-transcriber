[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aws-video-transcriber"
version = "0.1.0"
description = "Batch pipeline for transcribing and correcting Vietnamese AWS course videos"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-whisper>=0.4.3",
    "faster-whisper>=1.2.1",
    "typer>=0.15",
    "rich>=13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6",
    "rapidfuzz>=3.10",
    "httpx>=0.28",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks integration tests",
    "requires_model: marks tests that download or load model weights",
]

[project.scripts]
transcriber = "transcriber.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/transcriber"]
